name: CI Workflow

on:
  push:
    branches: ["my_changes"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: edufund_test
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # -------------------------
      # Laravel Backend
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, ctype, fileinfo, json, tokenizer, pdo_mysql

      - name: Install Laravel dependencies
        working-directory: ./Backend
        run: composer install --no-progress --prefer-dist --no-interaction

      # Install mysql client on runner so we can wait/import
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      # Create .env.testing used by php artisan test --env=testing
      - name: Create .env.testing for CI
        working-directory: ./Backend
        run: |
          cp .env.example .env.testing

          echo "APP_ENV=testing" >> .env.testing
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env.testing

          echo "DB_CONNECTION=mysql" >> .env.testing
          echo "DB_HOST=mysql" >> .env.testing
          echo "DB_PORT=3306" >> .env.testing
          echo "DB_DATABASE=edufund_test" >> .env.testing
          echo "DB_USERNAME=root" >> .env.testing
          echo "DB_PASSWORD=password" >> .env.testing

          # optional if tests require it
          echo "STRIPE_SECRET=${{ secrets.STRIPE_SECRET }}" >> .env.testing

      - name: Clear config cache
        working-directory: ./Backend
        run: |
          php artisan config:clear
          php artisan cache:clear

      - name: Generate Laravel app key (testing)
        working-directory: ./Backend
        run: php artisan key:generate --env=testing

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..60}; do
            mysqladmin ping -h mysql -uroot -ppassword --silent && exit 0
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Import test database dump
        run: |
          mysql -h mysql -uroot -ppassword edufund_test < Backend/database/edufund_test.sql

      - name: Run Laravel tests
        working-directory: ./Backend
        run: php artisan test --env=testing

      # -------------------------
      # Frontend
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./Frontend
        run: npm run build
